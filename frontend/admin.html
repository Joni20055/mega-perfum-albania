<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin · MEGA PERFUM ALBANIA</title>
  <meta name="theme-color" content="#111111">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">MEGA PERFUM <small>ALBANIA</small></a>
    <div class="top-actions">
      <a href="/">Dyqani</a>
      <button type="button" id="logout" hidden>Dil</button>
    </div>
  </header>

  <main>
    <section class="gate" id="gate">
      <p class="eyebrow">Admin</p>
      <h1>Hyrja</h1>
      <p class="lede">Këtu shihen mesazhet, kërkesat dhe porositë e klientëve.</p>
      <form id="login-form" novalidate>
        <label>Kodi
          <input name="code" type="password" autocomplete="current-password" maxlength="40" required>
        </label>
        <button class="btn" type="submit">Hyr</button>
        <p class="note" id="login-note" role="status"></p>
      </form>
    </section>

    <section class="desk" id="desk" hidden>
      <div class="desk-head">
        <div>
          <p class="eyebrow">Paneli</p>
          <h1>Kërkesat e klientëve</h1>
        </div>
        <button type="button" class="btn ghost" id="refresh">Rifresko</button>
      </div>
      <p class="summary" id="summary"></p>
      <div class="columns">
        <section>
          <h2>Mesazhet dhe kërkesat</h2>
          <div id="messages"></div>
        </section>
        <section>
          <h2>Porositë</h2>
          <div id="orders"></div>
        </section>
      </div>
    </section>
  </main>
  <script src="/js/admin.js"></script>
</body>
</html>
